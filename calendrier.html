<style>
.side-toggle{transition:box-shadow .2s ease,transform .2s ease}
.side-toggle:hover{box-shadow:0 10px 28px rgba(var(--sh-rgb),0.18)}
.side-toggle:active{transform:scale(.94)}
.side-toggle:focus-visible{outline:2px solid rgba(var(--sh-rgb),0.45);outline-offset:2px}
@keyframes sbFade{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.sb-fade{animation:sbFade .45s cubic-bezier(.22,.9,.28,1) both}
@media (prefers-reduced-motion:reduce){.sb-fade{animation:none}}
.cv-wrap{position:relative;display:block;min-width:0;width:100%}
.cv-tip{opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s;pointer-events:none}
.cv-wrap:hover{z-index:60}
.cv-wrap:hover .cv-tip{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .18s ease .05s,transform .18s ease .05s,visibility 0s linear 0s}
.cv-cell{transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.cv-cell:hover{z-index:20;box-shadow:0 14px 30px rgba(var(--sh-rgb),0.16)!important;transform:translateY(-1px)}
.cv-cell:focus-visible,.cv-mini:focus-visible{outline:2px solid rgba(var(--sh-rgb),0.45);outline-offset:2px}
.cv-mini{transition:background .15s ease}
.cv-mini:hover{background:rgba(19,17,28,0.06)}
.dd-opt{transition:background .15s ease,color .15s ease}
.dd-scroll{scrollbar-width:thin;scrollbar-color:rgba(var(--sh-rgb),0.28) transparent}
.dd-scroll::-webkit-scrollbar{width:6px}
.dd-scroll::-webkit-scrollbar-track{background:transparent}
.dd-scroll::-webkit-scrollbar-thumb{background:rgba(var(--sh-rgb),0.24);border-radius:6px}
.dd-scroll::-webkit-scrollbar-thumb:hover{background:rgba(var(--sh-rgb),0.42)}
.dd-scroll::-webkit-scrollbar-button{display:none}
.dd-opt:hover{background:rgba(19,17,28,0.05)}
.dd-opt:focus-visible{outline:2px solid rgba(var(--sh-rgb),0.4);outline-offset:-2px}
.tr-row{transition:background .15s ease}
.tr-row:hover{background:var(--accent-8, rgba(var(--sh-rgb),0.08))}
.act-cell{background:#FBFAFE;box-shadow:-14px 0 18px -14px rgba(var(--sh-rgb),0.22);transition:background-color .15s ease}
.act-head{background:#F6F2FD}
.tr-row:hover .act-cell{background-image:linear-gradient(var(--accent-8, rgba(var(--sh-rgb),0.08)),var(--accent-8, rgba(var(--sh-rgb),0.08)))}
.ic-del{transition:background .15s ease}
.ic-del:hover{background:rgba(194,37,92,0.20)!important}
.ic-btn:focus-visible,.ic-del:focus-visible{outline:2px solid var(--accent-40, rgba(var(--sh-rgb),0.45));outline-offset:2px}
.ic-btn{transition:background .15s ease}
.dd-opt{transition:background .15s ease,color .15s ease}
.dd-opt:hover{background:rgba(19,17,28,0.05)}
.dd-opt:focus-visible{outline:2px solid rgba(var(--sh-rgb),0.4);outline-offset:-2px}
.ic-btn:hover{background:rgba(19,17,28,0.06)}
.no-sb{scrollbar-width:none;-ms-overflow-style:none}
.no-sb::-webkit-scrollbar{display:none}
body{margin:0;background:#F8F6FD}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit}
</style>
