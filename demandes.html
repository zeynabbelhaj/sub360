.ic-del{transition:background .15s ease}
.ic-del:hover{background:rgba(194,37,92,0.20)!important}
.ic-btn:focus-visible,.ic-del:focus-visible{outline:2px solid var(--accent-40, rgba(var(--sh-rgb),0.45));outline-offset:2px}
.ic-btn{transition:background .15s ease}
.dd-opt{transition:background .15s ease,color .15s ease}

.ic-btn:hover{background:rgba(19,17,28,0.06)}
.no-sb{scrollbar-width:none;-ms-overflow-style:none}
.no-sb::-webkit-scrollbar{display:none}
body{margin:0;background:#F8F6FD}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit}
